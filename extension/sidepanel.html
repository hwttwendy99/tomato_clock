<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOMATO CLOCK</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="side-panel">
    <div class="pixel-bg"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-left">
            <button class="top-bar-btn" id="taskPanelBtn">🍅</button>
        </div>
        <div class="top-bar-center">
            <span class="mode-label" id="modeLabel">FOCUS</span>
        </div>
        <div class="top-bar-right"></div>
    </div>
    <button class="top-bar-btn settings-corner" id="settingsBtn">⚙️</button>

    <!-- Toast -->
    <div class="app-toast" id="appToast" role="status">
        <span id="appToastText"></span>
        <button class="mini-btn" id="toastCloseBtn">✕</button>
    </div>

    <!-- Main Timer Area -->
    <div class="timer-area">
        <div class="current-task-display" id="currentTaskDisplay"></div>
        <div class="timer-wrapper">
            <div class="timer-display" id="timerDisplay">25:00</div>
        </div>
        <div class="controls">
            <button class="pixel-btn btn-task-open" id="quickTaskBtn">+</button>
            <button class="pixel-btn btn-primary" id="startPauseBtn">START</button>
            <button class="pixel-btn btn-secondary" id="stopBtn">STOP</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="today-stats" id="todayStats"></div>

    <!-- Task Panel Overlay -->
    <div class="task-panel-overlay" id="taskPanelOverlay"></div>

    <!-- Task Panel (slide-in from left) -->
    <div class="task-panel" id="taskPanel">
        <div class="task-panel-header">
            <button class="top-bar-btn" id="taskPanelBackBtn">←</button>
            <span class="section-header-text">📋 TASKS</span>
        </div>
        <div class="task-input-group">
            <input type="text" class="pixel-input" id="taskInput" placeholder="Add a task...">
            <button class="pixel-btn btn-secondary" id="addTaskBtn" style="padding:12px 14px;">+</button>
        </div>
        <div id="taskList" class="task-list-scroll"></div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-panel">
            <h2 class="section-header" id="settingsTitle">⚙️ SETTINGS</h2>

            <div class="setting-row">
                <span class="setting-label" data-i18n="workDuration">Work Duration</span>
                <div class="setting-control">
                    <input type="number" class="number-input" id="workDuration" min="1" max="60" value="25">
                    <span data-i18n="min">min</span>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label" data-i18n="shortBreak">Short Break</span>
                <div class="setting-control">
                    <input type="number" class="number-input" id="shortBreakDuration" min="1" max="30" value="5">
                    <span data-i18n="min">min</span>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label" data-i18n="longBreak">Long Break</span>
                <div class="setting-control">
                    <input type="number" class="number-input" id="longBreakDuration" min="1" max="60" value="15">
                    <span data-i18n="min">min</span>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label" data-i18n="longBreakInterval">Long Break Interval</span>
                <div class="setting-control">
                    <input type="number" class="number-input" id="longBreakInterval" min="2" max="10" value="4">
                    <span data-i18n="cycles">cycles</span>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label" data-i18n="autoStart">Auto Start</span>
                <div class="setting-control">
                    <div class="checkbox-pixel" id="autoStartCheck"></div>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label" data-i18n="soundAlerts">Sound Alerts</span>
                <div class="setting-control">
                    <div class="checkbox-pixel checked" id="soundCheck"></div>
                </div>
            </div>

            <div style="display:flex;gap:10px;margin-top:20px;justify-content:center;">
                <button class="pixel-btn btn-primary" id="settingsSaveBtn">SAVE</button>
                <button class="pixel-btn btn-secondary" id="settingsCancelBtn">CANCEL</button>
            </div>
        </div>
    </div>


    <script src="sidepanel.js"></script>
</body>
</html>
